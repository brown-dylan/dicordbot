name: Daily Discord Check-In

on:
  workflow_dispatch:
    inputs:
      checkin_type:
        description: "Which check-in message should be sent?"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

  schedule:
    - cron: "5 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "5 17 * * 1-5"
      timezone: "America/New_York"

jobs:
  post-checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord check-in message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_DAILY_ROLE_ID }}
          CHECKIN_TYPE: ${{ github.event.inputs.checkin_type }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"].strip()
          role_id = os.environ["DISCORD_ROLE_ID"].strip()
          checkin_type = os.getenv("CHECKIN_TYPE", "")
          schedule_cron = os.getenv("SCHEDULE_CRON", "")

          if not webhook_url.startswith("https://"):
              raise ValueError("DISCORD_DAILY_WEBHOOK_URL must be the full Discord webhook URL starting with https://")

          if not role_id.isdigit():
              raise ValueError("DISCORD_DAILY_ROLE_ID must be only the numeric Discord role ID")

          morning_message = """Post your plan for today:

          1. Top priorities today:
          2. Client work:
          3. Admin/internal work:
          4. Blockers:
          5. Help needed from anyone:"""

          evening_message = """Post your wrap-up:

          1. Completed today:
          2. Still open:
          3. Blockers:
          4. Needs follow-up tomorrow:
          5. Anything someone else needs to take over:"""

          if checkin_type == "evening" or schedule_cron == "5 17 * * 1-5":
              title = "5:00 PM End-of-Day Check-In"
              body = evening_message
          else:
              title = "8:00 AM Morning Check-In"
              body = morning_message

          content = f"<@&{role_id}> **{title}**\n\n{body}"

          payload = {
              "content": content,
              "allowed_mentions": {
                  "roles": [role_id]
              }
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook_url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "FIT-MSP-GitHub-Actions-Checkin/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Discord response status: {response.status}")
          except urllib.error.HTTPError as e:
              print(f"Discord HTTP error: {e.code} {e.reason}")
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY
